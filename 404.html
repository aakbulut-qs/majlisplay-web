<style>:root{color-scheme:dark;--bg:#0A1430;--card:#13224A;--text:#F4EFE6;--muted:#A9B6C9;--accent:#F2C25B;--line:#26365E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header,main,footer{max-width:760px;margin:0 auto;padding:0 16px}
header{padding-top:24px;padding-bottom:8px}
.brand{color:var(--text);text-decoration:none;font-weight:800;font-size:20px;letter-spacing:.2px}
.brand span{color:var(--accent)}
main{padding-bottom:32px}
h1{font-size:30px;line-height:1.25;margin:24px 0 8px}
h2{font-size:20px;line-height:1.3;margin:28px 0 6px}
p,li{color:var(--text)}
.lead{color:var(--muted);font-size:18px}
.note{background:#3A2E12;border:1px solid var(--accent);border-radius:10px;padding:10px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}
ul{padding-left:22px}
footer{border-top:1px solid var(--line);padding-top:16px;padding-bottom:32px;color:var(--muted);font-size:15px}
footer nav a{margin-right:14px;display:inline-block;margin-bottom:6px}
.button{display:inline-block;background:var(--accent);color:#0A1430;font-weight:800;text-decoration:none;padding:12px 22px;border-radius:12px}
.code{font-size:40px;font-weight:800;letter-spacing:4px;color:var(--accent);margin:0}
.small{color:var(--muted);font-size:15px}</style>
</head>
